name: duel_multiplayer_quiz
description: "A live 1v1 trivia duel app with real-time sync and animated answer race."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^3.4.3
  flutter_animate: ^4.5.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^8.2.1
  http: ^1.2.0
  rxdart: ^0.28.0
  share_plus: ^10.1.4
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
