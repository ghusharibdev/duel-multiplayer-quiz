name: duel_multiplayer_quiz
description: "A live 1v1 trivia duel app with real-time sync and animated answer race."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.8.0
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_animate: ^4.5.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^8.2.1
  http: ^1.2.0
  rxdart: ^0.28.0
  share_plus: ^10.1.4
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_local_notifications_platform_interface: ^12.2.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/android_logo.png"
  background_color: "#0D1117"
  theme_color: "#E5533D"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/android_logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0D1117"
  color_dark: "#0D1117"
  image: assets/android_logo.png
  android_12:
    color: "#0D1117"
    color_dark: "#0D1117"
    image: assets/android_logo.png
  ios: true
  android: true
  fullscreen: true
